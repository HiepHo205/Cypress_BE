#import ../app/Modules/Api/GraphQL/api.graphql

scalar DateTime
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Upload
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

type Query {
    user(
        id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
        email: String
            @eq
            @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    users(name: String @where(operator: "like")): [User!]!
        @paginate(defaultCount: 10)

    roles: [Role!]!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\RoleQuery@roles"
        )
}

type Mutation {
    createUser(input: CreateUserInput!): CreateUserPayload!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@create"
        )

    updateUser(id: ID!, input: UpdateUserInput!): UpdateUserPayload!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@update"
        )

    deleteUser(id: ID!): DeleteUserPayload!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@delete"
        )

    deactivateUser(id: ID!): DeactivateUserPayload!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@deactivate"
        )
}

input CreateUserInput {
    name: String! @rules(apply: ["required", "string", "min:2"])
    email: String! @rules(apply: ["required", "email", "unique:users,email"])
    password: String! @rules(apply: ["required", "min:8"])
}

input UpdateUserInput {
    name: String @rules(apply: ["string", "min:2"])
    email: String @rules(apply: ["email"])
    password: String @rules(apply: ["min:8"])
    status: String @rules(apply: ["in:active,unactive"])
}

type CreateUserPayload {
    user: User!
}

type UpdateUserPayload {
    user: User!
}

type DeleteUserPayload {
    user: User!
}

type DeactivateUserPayload {
    user: User!
}

type User {
    id: ID!
    name: String!
    full_name: String
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
    status: String!
    role: Role @belongsTo
}

extend type Mutation {
    login(input: LoginInput! @spread): LoginResponse!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\AdminAuthMutation@login"
        )
}

type Role {
    id: ID!
    role_name: String!
    description: String
    created_at: DateTime
    updated_at: DateTime
}

input LoginInput {
    email: String!
    password: String!
}

type LoginResponse {
    status: Boolean!
    message: String!
    access_token: String
    token_type: String
    expires_in: Int
    user: User
}

type LogoutResponse {
    status: Boolean!
    message: String!
}

extend type Mutation {
    logout: LogoutResponse!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\AdminAuthMutation@logout"
        )
}

extend type Mutation {
    createRole(role_name: String!, description: String): Role!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\RoleMutation@createRole"
        )

    updateRole(id: ID!, role_name: String!, description: String): Role!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\RoleMutation@update"
        )

    deleteRole(id: ID!): Boolean!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\RoleMutation@delete"
        )
}

extend type Query {
    header: Header
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\HeaderQuery@header"
        )
}

type Header {
    logo: String
    menus: [Menu]
    cta: CTA
}

type Menu {
    id: ID!
    label: String
    children: [MenuChild]
}

type MenuChild {
    id: ID!
    label: String
    href: String
}

type CTA {
    label: String
    href: String
}

input HeaderMenuInput {
    label: String!
    children: [HeaderMenuChildInput!]
}

input HeaderMenuChildInput {
    label: String!
}
type HeaderMenuResponse {
    id: ID
    label: String
    children: [HeaderMenuChildResponse]
}

type HeaderMenuChildResponse {
    id: ID
    label: String
    href: String
}

type DeleteResponse {
    message: String
}

type Mutation {
    createHeaderMenu(input: HeaderMenuInput!): HeaderMenuResponse
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@createHeaderMenu"
        )

    updateHeaderMenu(id: ID!, input: HeaderMenuInput!): HeaderMenuResponse
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@updateHeaderMenu"
        )

    deleteHeaderMenu(id: ID!): DeleteResponse
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@deleteHeaderMenu"
        )
}

extend type Mutation {
    updateLogo(logo: Upload!): HeaderLogo!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@updateLogo"
        )
}
type HeaderLogo {
    logo: String
}

extend type Query {
    getLogo: HeaderLogo
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\HeaderQuery@getLogo"
        )
}
type HeaderCountdownButton {
    label: String
    href: String
}

type HeaderCountdown {
    enabled: Boolean!
    target_date: DateTime
    button: HeaderCountdownButton
}

type Response {
    success: Boolean!
    message: String!
}

extend type Header {
    countdown: HeaderCountdown
}

input UpdateHeaderCountdownInput {
    enabled: Boolean!
    target_date: DateTime
    button_label: String
    button_href: String
}

extend type Mutation {
    updateHeaderCountdown(input: UpdateHeaderCountdownInput!): Response!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@updateCountdown"
        )
}

extend type Mutation {
    updateFavicon(favicon: Upload!): HeaderFavicon!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@updateFavicon"
        )
}

type HeaderFavicon {
    url: String
    public_id: String
}

extend type Query {
    getFavicon: HeaderFavicon
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\HeaderQuery@getFavicon"
        )
}
