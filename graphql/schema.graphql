#import ../app/Modules/Api/GraphQL/api.graphql

scalar DateTime
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Upload
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

type Query {
    user(
        id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
        email: String
            @eq
            @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @guard(with: ["api"]) @find

    users(name: String @where(operator: "like")): [User!]!
        @guard(with: ["api"])
        @paginate(defaultCount: 10)

    roles: [Role!]!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\RoleQuery@roles"
        )

    permissions: [Permission!]!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\PermissionQuery@permissions"
        )
}

extend type Mutation {
    createUser(input: CreateUserInput!): CreateUserPayload!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@create"
        )

    updateUser(id: ID!, input: UpdateUserInput!): UpdateUserPayload!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@update"
        )

    deleteUser(id: ID!): DeleteUserPayload!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@delete"
        )

    deactivateUser(id: ID!): DeactivateUserPayload!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\UserMutation@deactivate"
        )
    assignPermission(userId: ID!, permissionId: ID!): Boolean!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\PermissionMutation@assignPermission"
        )

    unassignPermission(userId: ID!, permissionId: ID!): Boolean!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\PermissionMutation@unassignPermission"
        )
}

input CreateUserInput {
    name: String!
    email: String!
    password: String!
    role_id: ID!
}

input UpdateUserInput {
    name: String
    email: String
    password: String
    status: String
    role_id: ID
}

type CreateUserPayload {
    user: User!
}

type UpdateUserPayload {
    user: User!
}

type DeleteUserPayload {
    user: User!
}

type DeactivateUserPayload {
    user: User!
}

type User {
    id: ID!
    name: String!
    full_name: String
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
    status: String!
    role_id: ID
    role: Role @belongsTo
    permissions: [Permission!]! @belongsToMany
}

extend type Mutation {
    login(input: LoginInput! @spread): LoginResponse!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\AdminAuthMutation@login"
        )
}

type Role {
    id: ID!
    role_name: String!
    description: String
    created_at: DateTime
    updated_at: DateTime
}

type Permission {
    id: ID!
    code: String!
    description: String
}

input LoginInput {
    email: String!
    password: String!
}

type LoginResponse {
    status: Boolean!
    message: String!
    access_token: String
    token_type: String
    expires_in: Int
    user: User
}

type LogoutResponse {
    status: Boolean!
    message: String!
}

extend type Mutation {
    logout: LogoutResponse!
        @guard(with: ["api"])
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\AdminAuthMutation@logout"
        )
}

