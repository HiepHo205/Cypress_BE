extend type Mutation {
    updateFavicon(favicon: Upload!): HeaderFavicon!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\HeaderMutation@updateFavicon"
        )
}

type HeaderFavicon {
    url: String
    public_id: String
}

extend type Query {
    getFavicon: HeaderFavicon
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\HeaderQuery@getFavicon"
        )
}

extend type Query {
    headerCta: HeaderCTA
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Queries\\HeaderQuery@getCta"
        )
}

type PlanBenefit {
    id: ID!
    value: String!
}

type PlanFeature {
    id: ID!
    name: String!
    group: String!
    benefits: [PlanBenefit!]!
}

type Plan {
    id: ID!
    plan_name: String!
    price: String!
    features: [PlanFeature!]!
}

input BenefitInput {
    id: ID
    value: String!
}

input FeatureInput {
    id: ID!
    benefits: [BenefitInput!]!
}

input CreatePlanInput {
    plan_name: String!
    price: String!

    features: [FeatureInput!]!
}

input UpdatePlanInput {
    plan_name: String!
    price: String!

    features: [FeatureInput!]!
}

extend type Mutation {
    createPlan(
        input: CreatePlanInput!
    ): Plan!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\PlanMutation@create"
        )

    updatePlan(
        id: ID!
        input: UpdatePlanInput!
    ): Plan!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\PlanMutation@update"
        )

    deletePlan(
        id: ID!
    ): Boolean!
        @field(
            resolver: "App\\Modules\\Admin\\GraphQL\\Mutations\\PlanMutation@delete"
        )
}